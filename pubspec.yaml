name: creditsea
description: "CreditSea loan application app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.11.1
  get_storage: ^2.1.1
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  shimmer: ^3.0.0
  razorpay_flutter: ^1.4.7
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
